<head>

    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=20260804-ls2">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=20260804-ls2">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20260804-ls2">
    <link rel="manifest" href="site.webmanifest?v=20260804-ls2">
    <meta name="theme-color" content="#0b1628">
    <!-- LS_FAVICON_END -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Inglês diário — Life Style</title>
  <link rel="stylesheet" href="painel.css?v=20260804-ls-brand2">
  <link rel="stylesheet" href="style.css?v=20260803-50">
  <link rel="stylesheet" href="ingles.css?v=20260808-ingles-v9">
  <link rel="stylesheet" href="ingles-experiencia.css?v=20260808-ingles-v13">
</head>
<body>
  <div class="app-shell">
    <header class="app-topbar">
      <div class="app-topbar__inner">
        <div>
          <span class="app-topbar__title">LIFE STYLE</span>
          <span class="app-topbar__subtitle">Inglês diário</span>
        </div>
        <button id="theme-toggle" class="icon-btn" aria-label="Alternar tema">☾</button>
      </div>
    </header>

    <main class="app-main meditation-page">
      <section class="page-header">
        <div>
          <p class="eyebrow">Prática diária</p>
          <h1>Inglês diário</h1>
          <p class="muted">Uma aula por dia: entenda a estrutura, leia e pratique, reconheça o inglês em uma cena real, produza e revise.</p>
          <div id="ingles-nivel" class="english-level" hidden></div>
        </div>
        <label class="date-select">
          <span>Data</span>
          <select id="ingles-data"></select>
        </label>
      </section>
<!-- MMCD_ENGLISH_STUDY_MAP_START -->
      <section class="card english-study-map" aria-label="Roteiro fixo da aula">
        <div class="english-study-map__summary">
          <div><span>Nível</span><strong id="english-summary-level">—</strong></div>
          <div><span>Foco de hoje</span><strong id="english-summary-focus">Carregando...</strong></div>
          <div><span>Série final</span><strong id="english-summary-scene">Carregando...</strong></div>
        </div>
        <nav class="english-study-map__route" aria-label="Etapas do estudo">
          <button class="english-study-step" type="button" data-english-step="understand"><b>1</b>Entenda</button>
          <button class="english-study-step" type="button" data-english-step="read"><b>2</b>Leia</button>
          <button class="english-study-step" type="button" data-english-step="produce"><b>3</b>Produza</button>
          <button class="english-study-step" type="button" data-english-step="scene"><b>4</b>Série</button>
        </nav>
      </section>
<!-- MMCD_ENGLISH_STUDY_MAP_END -->
<article class="card english-card">
        <div class="highlight-tools english-highlight-toolbar">
          <button id="ingles-marcar" class="btn english-highlight-btn" type="button">
            Salvar para estudar
          </button>
          <button id="ingles-limpar" class="btn" type="button">
            Limpar todas
          </button>
          <p class="muted">Selecione palavras ou expressões para levar ao seu Anki.</p>
        </div>
        <div id="ingles-conteudo" class="meditacao english-reading">
          <p class="muted">Carregando...</p>
        </div>
      </article>

      <!-- MMCD_REVIEW_ANKI_START -->
<!-- MMCD_REVIEW_ANKI_END -->
</main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=20260803-50"></script>
  <script src="supabase-client.js?v=20260803-50"></script>
  <script src="auth.js?v=20260803-50"></script>
  <script src="dados-app.js?v=20260806-abono1"></script>
  <script src="shell.js?v=20260808-series-auto1"></script>
  <script>MMCDShell("ingles")</script>
  <script src="ingles-experiencia.js?v=20260808-ingles-v13"></script>
  <script src="ingles.js?v=20260808-ingles-v9"></script>
</body>
</html>
