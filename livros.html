<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Livros — Meu Momento com Deus</title><link rel="stylesheet" href="painel.css?v=20260729-final"></head><body><div class="app-shell"><header class="app-topbar"><div class="app-topbar__inner"><span class="app-topbar__title">Meu Momento com Deus</span><button id="theme-toggle" class="icon-btn">☾</button></div></header><main class="app-main"><section class="page-header"><div><p class="eyebrow">Conhecimento</p><h1>Minha biblioteca</h1><p class="muted">Cadastre o livro atual e dê baixa quando concluir.</p></div></section><div class="books-layout"><div><section class="card book-current"><p class="eyebrow">Livro atual</p><h2 id="current-title"></h2><p id="current-author" class="muted"></p><div class="field"><label>Título</label><input id="cur-title"></div><div class="field"><label>Autor</label><input id="cur-author"></div><div class="field"><label>Data de início</label><input id="cur-start" type="date"></div><button id="save-current" class="btn primary" style="margin-top:12px;width:100%">Salvar livro atual</button></section><section class="card book-form" style="margin-top:20px"><p class="eyebrow">Concluir livro</p><h2>Registrar conclusão</h2><div class="field"><label>Título</label><input id="done-title"></div><div class="field"><label>Autor</label><input id="done-author"></div><div class="book-form-grid"><div class="field"><label>Início</label><input id="done-start" type="date"></div><div class="field"><label>Conclusão</label><input id="done-end" type="date"></div></div><div class="field"><label>Principal aprendizado</label><textarea id="done-note" rows="3"></textarea></div><button id="add-book" class="btn primary" style="margin-top:12px;width:100%">Adicionar aos concluídos</button><p id="book-msg" class="save-note"></p></section></div><div><section class="card book-list"><div class="book-goal"><div><p class="eyebrow">Meta anual</p><h2><spa
