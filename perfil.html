  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="manifest" href="site.webmanifest?v=20260817-v81-2-1" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/imagens/pwa/memory-favicon-32-v81-11-3.png?v=20260822-v81-11-3" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/imagens/pwa/memory-icon-192-v81-11-3.png?v=20260822-v81-11-3" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/imagens/pwa/memory-apple-touch-180-v81-11-3.png?v=20260822-v81-11-3" />
  <meta name="apple-mobile-web-app-title" content="Memory" />

  <title>Meu perfil — Memory</title>
  <link rel="stylesheet" href="nucleo/painel.css?v=20260819-v81-4-8">
  <link rel="stylesheet" href="modulos/perfil/perfil.css?v=20260819-v81-4-8">
  <link rel="stylesheet" href="nucleo/comfort-vision-v81-14.css?v=20260823-v81-14">
</head>
<body>
  <div class="app-shell">
    <header class="app-topbar">
      <div class="app-topbar__inner">
        <div>
          <span class="app-topbar__title">MEMORY</span>
          <span class="app-topbar__subtitle">Perfil do usuário</span>
        </div>
        <button id="theme-toggle" class="icon-btn" aria-label="Tema">☾</button>
      </div>
    </header>

    <main class="app-main profile-page">
      <section class="page-header">
        <div>
          <p class="eyebrow">Configurações</p>
          <h1>Meu perfil</h1>
          <p class="muted">Personalize sua identificação sem alterar o restante do sistema.</p>
        </div>
      </section>

      <section class="card section profile-card">
        <div class="profile-preview-wrap">
          <div id="profile-preview" class="profile-avatar profile-avatar--large" aria-label="Prévia da foto">
            <span id="profile-initial">U</span>
          </div>
          <div class="profile-preview-copy">
            <p class="eyebrow">Foto de perfil</p>
            <h2 id="profile-user-name">Seu usuário</h2>
            <p id="profile-user-email" class="muted"></p>
          </div>
        </div>

        <div class="profile-actions">
          <input id="profile-file" type="file" accept="image/*" hidden>
          <button id="profile-choose" class="btn primary" type="button">Escolher foto</button>
          <button id="profile-remove" class="btn" type="button">Remover foto</button>
        </div>
        <p id="profile-status" class="profile-status" aria-live="polite"></p>
        <p class="profile-note muted">A imagem é reduzida automaticamente e salva no seu próprio perfil. Ela aparece de forma discreta ao lado do usuário no menu.</p>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="nucleo/supabase-config.js?v=20260819-v81-4-8"></script>
  <script src="nucleo/supabase-client.js?v=20260819-v81-4-8"></script>

  <script src="nucleo/shell-v81.js?v=20260819-v81-4-8"></script>
  <script>MMCDShell('perfil')</script>
  <script src="modulos/perfil/perfil.js?v=20260819-v81-4-8"></script>
  <script src="nucleo/memory-logo-guard-v81-11-3.js?v=20260822-v81-11-3"></script>
  <script src="nucleo/comfort-vision-v81-14.js?v=20260823-v81-14"></script>
</body>
</html>
