<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atividades Diárias — Life Style</title><link rel="stylesheet" href="painel.css"><link rel="stylesheet" href="atividades.css"></head><body><div class="app-shell"><header class="app-topbar"><div class="app-topbar__inner"><div><span class="app-topbar__title">LIFE STYLE</span><span class="app-topbar__subtitle">Execução e histórico diário</span></div><button id="theme-toggle" class="icon-btn">☾</button></div></header><main class="app-main"><section class="page-header"><div><p class="eyebrow">Rotina</p><h1>Atividades diárias</h1><p class="muted">Escolha qualquer data para registrar, consultar ou corrigir suas atividades.</p></div><div class="page-header__actions"><a href="metas.html" class="btn">Gerenciar metas</a><button id="go-today" class="btn primary">Hoje</button></div></section><section class="card mission-progress"><div class="progress-copy"><div><p class="eyebrow">Progresso do dia</p><strong id="day-progress-label">0%</strong></div><span id="save-status" class="muted">Salvo neste navegador</span></div><div class="progress-track"><span id="day-progress-bar"></span></div></section><section class="activities-layout"><section class="card calendar-card"><div class="calendar-head"><button id="prev-month" class="icon-btn" aria-label="Mês anterior">‹</button><div><p class="eyebrow">Calendário de atividades</p><h2 id="month-title"></h2></div><button id="next-month" class="icon-btn" aria-label="Próximo mês">›</button></div><div class="calendar-weekdays"><span>SEG</span><span>TER</span><span>QUA</span><span>QUI</span><span>SEX</span><span>SÁB</span><span>DOM</span></div><div id="calendar-grid" class="calendar-grid"></div></section><aside class="card daily-card"><div class="daily-head"><div><p class="eyebrow">Registro do dia</p><h2 id="selected-date"></h2><span id="selected-weekday" class="muted"></span></div><button id="panel-today" class="btn small">Hoje</button></div><div id="daily-goals" class="daily-goals"></div><label class="field"><span>Peso (kg)</span><input id="day-weight" type="number" step="0.1" placeholder="Ex.: 95,2"></label><label class="field"><span>Observação</span><textarea id="day-note" rows="4" placeholder="Como foi o seu dia?"></textarea></label></aside></section></main></div><script src="dados/meditacoes.js"></script><script src="dados-app.js"></script><script src="shell.js"></script><script>MMCDShell('atividades')</script><script src="atividades.js"></script></body></html>
