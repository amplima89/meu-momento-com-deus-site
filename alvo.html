<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metas — LIFE STYLE</title><link rel="stylesheet" href="painel.css?v=20260729-final"></head><body>
<div class="app-shell"><header class="app-topbar"><div class="app-topbar__inner"><span class="app-topbar__title">Meu Momento com Deus</span><button id="theme-toggle" class="icon-btn">☾</button></div></header>
<main class="app-main"><section class="page-header"><div><p class="eyebrow">Missão atual</p><h1 id="mission-title">Retomar o controle</h1><p id="mission-period" class="muted"></p></div><div class="page-header__actions"><button id="export" class="btn">Exportar</button> <label class="btn" for="import">Importar</label><input id="import" hidden type="file" accept=".json,application/json"></div></section>
<section class="card card-pad"><div class="section-head"><div><p class="eyebrow">Progresso da missão</p><strong id="mission-progress">0%</strong></div><span id="storage-mode" class="status-pill"></span></div><div class="progress"><i id="mission-bar" style="width:0"></i></div></section>
<section class="dashboard-grid" style="margin-top:20px"><article class="card calendar-card"><div class="calendar-head"><button id="prev" class="icon-btn">‹</button><div style="text-align:center"><p class="eyebrow">Calendário de hábitos</p><h2 id="month-title"></h2></div><button id="next" class="icon-btn">›</button></div><div class="weekdays"><span>SEG</span><span>TER</span><span>QUA</span><span>QUI</span><span>SEX</span><span>SÁB</span><span>DOM</span></div><div id="calendar" class="calendar-grid"></div></article>
<aside class="card day-panel"><div class="section-head"><div><p class="eyebrow">Registro do dia</p><h2 id="day-title"></h2><small id="day-sub" class="muted"></small></div><button id="today" class="btn">Hoje</button></div><div id="habits" class="habit-list"></div><div class="field"><label for="weight">Peso (kg)</label><input id="weight" type="number" step="0.1" min="40" max="250"></div><div class="field"><label for="note">Observação</label><textarea id="note" rows="3"></textarea></div><button id="save" class="btn primary" style="width:100%;margin-top:12px">Salvar alterações</button><p id="save-note" class="save-note"></p></aside></section>
<section class="card week-card"><div class="section-head"><div><p class="eyebrow">Mensuração semanal</p><h2 id="week-title"></h2></div><strong id="week-score"></strong></div><div id="week-metrics" class="metrics"></div></section></main></div>
<script src="dados-app.js"></script><script src="shell.js?v=20260729-final"></script><script src="alvo.js"></script></body></html>
