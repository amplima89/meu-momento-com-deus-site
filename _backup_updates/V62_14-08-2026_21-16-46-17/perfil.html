<!doctype html>
<html lang="pt-BR">
<head>
  <!-- LS_FAVICON_START -->
  <link rel="icon" href="favicon.ico?v=20260814-memory-v42" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=20260814-memory-v42">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=20260814-memory-v42">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20260814-memory-v42">
  <link rel="manifest" href="site.webmanifest?v=20260814-memory-v42">
  <meta name="theme-color" content="#0b1628">
  <!-- LS_FAVICON_END -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meu perfil — Memory</title>
  <link rel="stylesheet" href="painel.css?v=20260812-foto-v33">
  <link rel="stylesheet" href="perfil.css?v=20260812-foto-v33">
</head>
<body>
  <div class="app-shell">
    <header class="app-topbar">
      <div class="app-topbar__inner">
        <div>
          <span class="app-topbar__title">MEMORY</span>
          <span class="app-topbar__subtitle">Perfil do usuário</span>
        </div>
        <button id="theme-toggle" class="icon-btn" aria-label="Tema">☾</button>
      </div>
    </header>

    <main class="app-main profile-page">
      <section class="page-header">
        <div>
          <p class="eyebrow">Configurações</p>
          <h1>Meu perfil</h1>
          <p class="muted">Personalize sua identificação sem alterar o restante do sistema.</p>
        </div>
      </section>

      <section class="card section profile-card">
        <div class="profile-preview-wrap">
          <div id="profile-preview" class="profile-avatar profile-avatar--large" aria-label="Prévia da foto">
            <span id="profile-initial">U</span>
          </div>
          <div class="profile-preview-copy">
            <p class="eyebrow">Foto de perfil</p>
            <h2 id="profile-user-name">Seu usuário</h2>
            <p id="profile-user-email" class="muted"></p>
          </div>
        </div>

        <div class="profile-actions">
          <input id="profile-file" type="file" accept="image/*" hidden>
          <button id="profile-choose" class="btn primary" type="button">Escolher foto</button>
          <button id="profile-remove" class="btn" type="button">Remover foto</button>
        </div>
        <p id="profile-status" class="profile-status" aria-live="polite"></p>
        <p class="profile-note muted">A imagem é reduzida automaticamente e salva no seu próprio perfil. Ela aparece de forma discreta ao lado do usuário no menu.</p>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=20260803-50"></script>
  <script src="supabase-client.js?v=20260803-50"></script>
  <script src="auth.js?v=20260814-memory-v42"></script>
  <script src="theme-system.js?v=20260814-memory-v42"></script>
  <script src="shell.js?v=20260814-v61"></script>
  <script>MMCDShell('perfil')</script>
  <script src="perfil.js?v=20260812-foto-v33"></script>
</body>
</html>
