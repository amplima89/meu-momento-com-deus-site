<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1628">
  <script>
    // Aplica a paleta salva antes da primeira pintura para evitar que Treinos abra branco/azul.
    try {
      const tema = localStorage.getItem("mmcd:tema") || localStorage.getItem("tema-livro") || "claro";
      document.documentElement.dataset.tema = tema;
    } catch (_) {}
  </script>
  <title>Plano de treino — Configurações — Life Style</title>
  <link rel="icon" href="favicon.ico?v=" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=">

  <link rel="stylesheet" href="/meu-momento-com-deus-site/painel.css?v=" onerror="this.onerror=null;this.href='/meu-momento-com-deus-site/painel.css?v='+Date.now()">
  <link rel="stylesheet" href="/meu-momento-com-deus-site/treinos.css?v=20260812-pai-atleta-v30" onerror="this.onerror=null;this.href='/meu-momento-com-deus-site/treinos.css?retry='+Date.now()">
</head>
<body>
  <div class="app-shell">
    <header class="app-topbar">
      <div class="app-topbar__inner">
        <div>
          <span class="app-topbar__title">LIFE STYLE</span>
          <span class="app-topbar__subtitle">Configurações · Plano de treino</span>
        </div>
        <div class="topbar-actions">
          <span id="treino-save-status">Carregando…</span>
          <button id="theme-toggle" class="icon-btn" aria-label="Alternar tema">☾</button>
        </div>
      </div>
    </header>
    <main class="app-main treino-page treino-config-page">
      <section class="treino-hero treino-config-hero">
        <div>
          <p class="eyebrow">Configurações › Plano de treino</p>
          <h1>Plano de treino</h1>
          <p class="muted">Programa, período, composição dos treinos e medidas corporais.</p>
        </div>
        <a class="btn" href="treinos.html#hoje">Abrir Treinos</a>
      </section>
      <section class="treino-panel" data-panel="configuracoes">
        <div id="treino-settings-root"></div>
      </section>
    </main>
  </div>
  <script>window.MMCD_TREINO_PAGE_MODE="configuracoes";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (async function(){
    const BASE='/meu-momento-com-deus-site/';
    const VERSION='20260812-pai-atleta-v30';

    function loadScript(file){
      return new Promise((resolve,reject)=>{
        const primary=document.createElement("script");
        primary.src=BASE+file+"?v="+VERSION;
        primary.onload=()=>resolve();
        primary.onerror=()=>{
          primary.remove();
          const fallback=document.createElement("script");
          fallback.src=BASE+file+"?retry="+Date.now();
          fallback.onload=()=>resolve();
          fallback.onerror=()=>reject(new Error("Não foi possível carregar "+file));
          document.body.appendChild(fallback);
        };
        document.body.appendChild(primary);
      });
    }

    try{
      await loadScript("supabase-config.js");
      await loadScript("supabase-client.js");
      await loadScript("auth.js");
      await loadScript("dados-app.js");
      await loadScript("theme-system.js");
      await loadScript("shell.js");
      await window.MMCDShell(window.MMCD_TREINO_PAGE_MODE==="configuracoes"?"treinos-config":"treinos");
      await loadScript("treinos-data.js");
      await loadScript("treinos-visuais.js");
      await loadScript("treinos.js");
    }catch(error){
      console.error("Falha ao iniciar Treinos:",error);
      const status=document.querySelector("#treino-save-status");
      if(status) status.textContent="Falha ao carregar — atualize a página";
      const root=document.querySelector("#treino-today-root") || document.querySelector("#treino-settings-root");
      if(root && !root.innerHTML.trim()){
        root.innerHTML='<article style="padding:20px;border:1px solid #ddd;border-radius:12px"><strong>Não foi possível carregar os arquivos do módulo Treinos.</strong><p>Atualize a página. Se persistir, execute novamente a atualização V30.</p></article>';
      }
    }
  })();
  </script>
<div id="exercise-guide-modal" class="exercise-guide-modal" hidden>
    <div class="exercise-guide-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="exercise-guide-modal-title">
      <button class="exercise-guide-modal__close" type="button" data-action="close-exercise-guide" aria-label="Fechar">×</button>
      <div class="exercise-guide-modal__head">
        <span class="treino-kicker">GUIA VISUAL</span>
        <h2 id="exercise-guide-modal-title">Execução do exercício</h2>
      </div>
      <div id="exercise-guide-modal-body"></div>
    </div>
  </div>
</body>
</html>
