<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Livro devocional">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="topo">
        <div class="topo__conteudo">
            <div class="marca">
                <span class="marca__simbolo" aria-hidden="true">✦</span>
                <div>
                    <p class="marca__rotulo">Livro devocional</p>
                </div>
            </div>

            <div class="topo__acoes">
                <label class="campo-data" for="seletor-data">
                    <span>Data</span>
                    <select id="seletor-data" aria-label="Selecionar meditação por data"></select>
                </label>

                <button
                    id="botao-tema"
                    class="botao-icone"
                    type="button"
                    aria-label="Ativar tema escuro"
                    title="Ativar tema escuro"
                >
                    <span id="icone-tema" aria-hidden="true">☾</span>
                </button>
            </div>
        </div>
    </header>

    <main class="pagina">
        <article class="livro" aria-live="polite">

            <header class="livro__cabecalho">
                <p id="data-meditacao" class="livro__data">
                    Carregando...
                </p>

                <h2 id="titulo-meditacao" class="livro__titulo">
                    Meu Momento com Deus
                </h2>

                <div id="metadados-meditacao" class="metadados" hidden>
                    <span id="meta-clima" class="metadado" hidden></span>
                    <span id="meta-temperatura" class="metadado" hidden></span>
                    <span id="meta-referencia" class="metadado" hidden></span>
                </div>
            </header>

            <!-- Spotify -->
            <section class="spotify-player">

                <h3>🎧 Prepare seu coração</h3>

                <p class="spotify-player__texto">
                    Se desejar, coloque uma música enquanto faz sua meditação.
                </p>

                <iframe
                    style="border-radius:12px"
                    src="https://open.spotify.com/embed/artist/6nrqAqb26GkZsICC5sCZaO"
                    width="100%"
                    height="352"
                    frameborder="0"
                    allowfullscreen=""
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                    loading="lazy">
                </iframe>

            </section>

            <div id="conteudo-meditacao" class="meditacao">
                <p class="estado-carregando">
                    Carregando a meditação...
                </p>
            </div>

            <footer class="pagina-livro__rodape">
                <span id="numero-pagina"></span>
                <span class="pagina-livro__ornamento" aria-hidden="true">✦</span>
            </footer>

        </article>

        <nav class="navegacao" aria-label="Navegação entre meditações">

            <button id="botao-anterior" class="botao-navegacao" type="button">
                <span aria-hidden="true">←</span>
                <span>Anterior</span>
            </button>

            <button
                id="botao-hoje"
                class="botao-navegacao botao-navegacao--principal"
                type="button">
                Hoje
            </button>

            <button id="botao-proximo" class="botao-navegacao" type="button">
                <span>Próxima</span>
                <span aria-hidden="true">→</span>
            </button>

        </nav>

    </main>

    <footer class="rodape-site">
        <p>Um registro da obra de Deus na minha vida.</p>
    </footer>

    <script src="dados/meditacoes.js"></script>
    <script src="app.js"></script>

</body>
</html>
