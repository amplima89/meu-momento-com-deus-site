<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1628">
  <script>
    // Aplica a paleta salva antes da primeira pintura para evitar que Treinos abra branco/azul.
    try {
      const tema = localStorage.getItem("mmcd:tema") || localStorage.getItem("tema-livro") || "claro";
      document.documentElement.dataset.tema = tema;
    } catch (_) {}
  </script>
  <title>Treinos — Memory</title>
  <link rel="icon" href="favicon.ico?v=20260814-memory-v42" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260814-memory-v42">

  <script>
    // Compatibilidade com links antigos: cadastro nunca abre dentro de Treinos.
    if (location.hash === "#configuracoes") {
      history.replaceState(null, "", location.pathname + location.search + "#hoje");
    }
  </script>
  <link rel="stylesheet" href="/meu-momento-com-deus-site/painel.css?v=20260814-v59" onerror="this.onerror=null;this.href='/meu-momento-com-deus-site/painel.css?v=20260814-v59'+Date.now()">
  <link rel="stylesheet" href="/meu-momento-com-deus-site/treinos.css?v=20260814-v59" onerror="this.onerror=null;this.href='/meu-momento-com-deus-site/treinos.css?retry='+Date.now()">
  <link rel="stylesheet" href="/meu-momento-com-deus-site/treinos-rest-v62.css?v=20260814-v62">
  <link rel="stylesheet" href="/meu-momento-com-deus-site/treinos-tecnica-v62.css?v=20260814-v62">
</head>
<body>
  <div class="app-shell">
    <header class="app-topbar">
      <div class="app-topbar__inner">
        <div>
          <span class="app-topbar__title">MEMORY</span>
          <span class="app-topbar__subtitle">Plano de treino</span>
        </div>
        <div class="topbar-actions">
          <span id="treino-save-status">Carregando…</span>
          <button id="theme-toggle" class="icon-btn" aria-label="Alternar tema">☾</button>
        </div>
      </div>
    </header>

    <main class="app-main treino-page">
      <section class="treino-hero">
        <div>
          <p class="eyebrow">Treinos</p>
          <h1 id="treino-program-name">Plano de treino</h1>
          <p id="treino-program-objective" class="muted">Carregando seu programa…</p>
        </div>
        <div class="treino-hero-side">
          <strong id="treino-today-label">Hoje</strong>
          <span>Abrir → treinar → registrar → fechar.</span>
        </div>
      </section>

      <nav class="treino-tabs" aria-label="Áreas do plano de treino">
        <button class="treino-tab active" data-tab="hoje">🏋️ Hoje</button>
        <button class="treino-tab" data-tab="historico">📅 Histórico</button>
        <button class="treino-tab" data-tab="evolucao">📈 Evolução</button>
      </nav>

      <section class="treino-panel" data-panel="hoje">
        <div id="treino-today-root"></div>
      </section>

      <section class="treino-panel" data-panel="historico" hidden>
        <div class="history-toolbar">
          <div><p class="eyebrow">Histórico</p><h2 id="history-month-label">Mês</h2></div>
        </div>
        <div id="treino-history-root"></div>
      </section>

      <section class="treino-panel" data-panel="evolucao" hidden>
        <div class="page-header">
          <div><p class="eyebrow">Evolução</p><h1>Seu progresso</h1><p class="muted">Frequência, cargas e medidas sem poluir a tela de treino.</p></div>
        </div>
        <div id="treino-evolution-root"></div>
      </section>
</main>
  </div>

  <div id="finish-modal" class="finish-modal" hidden>
    <div class="finish-modal-card">
      <button id="finish-modal-close" class="finish-modal-close" aria-label="Fechar">×</button>
      <div id="finish-modal-body"></div>
    </div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (async function(){
    const BASE='/meu-momento-com-deus-site/';
    const VERSION='20260814-v62-load-logo-fix';

    function loadScript(file){
      return new Promise((resolve,reject)=>{
        const primary=document.createElement("script");
        primary.src=BASE+file+"?v="+VERSION;
        primary.onload=()=>resolve();
        primary.onerror=()=>{
          primary.remove();
          const fallback=document.createElement("script");
          fallback.src=BASE+file+"?retry="+Date.now();
          fallback.onload=()=>resolve();
          fallback.onerror=()=>reject(new Error("Não foi possível carregar "+file));
          document.body.appendChild(fallback);
        };
        document.body.appendChild(primary);
      });
    }

    try{
      await loadScript("supabase-config.js");
      await loadScript("supabase-client.js");
      await loadScript("auth.js");
      await loadScript("dados-app.js");
      await loadScript("theme-system.js");
      await loadScript("shell-v62.js");
      await window.MMCDShell(window.MMCD_TREINO_PAGE_MODE==="configuracoes"?"treinos-config":"treinos");
      await loadScript("treinos-data-v62.js");
      await loadScript("treinos-visuais-v62.js");
      await loadScript("treinos-v62.js");
    }catch(error){
      console.error("Falha ao iniciar Treinos:",error);
      const status=document.querySelector("#treino-save-status");
      if(status) status.textContent="Falha ao carregar — atualize a página";
      const root=document.querySelector("#treino-today-root") || document.querySelector("#treino-settings-root");
      if(root && !root.innerHTML.trim()){
        root.innerHTML='<article style="padding:20px;border:1px solid #ddd;border-radius:12px"><strong>Não foi possível carregar os arquivos do módulo Treinos.</strong><p>Atualize a página. Se persistir, feche e abra novamente o Memory.</p></article>';
      }
    }
  })();
  </script>
<div id="exercise-guide-modal" class="exercise-guide-modal" hidden>
    <div class="exercise-guide-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="exercise-guide-modal-title">
      <button class="exercise-guide-modal__close" type="button" data-action="close-exercise-guide" aria-label="Fechar">×</button>
      <div class="exercise-guide-modal__head">
        <span class="treino-kicker">GUIA VISUAL</span>
        <h2 id="exercise-guide-modal-title">Execução do exercício</h2>
      </div>
      <div id="exercise-guide-modal-body"></div>
    </div>
  </div>
</body>
</html>
