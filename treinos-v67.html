<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (async function(){
    const BASE='/meu-momento-com-deus-site/';
    const VERSION='20260814-v67-musculacao-meta-link';

    function loadScript(file){
      return new Promise((resolve,reject)=>{
        const primary=document.createElement("script");
        primary.src=BASE+file+"?v="+VERSION;
        primary.onload=()=>resolve();
        primary.onerror=()=>{
          primary.remove();
          const fallback=document.createElement("script");
          fallback.src=BASE+file+"?retry="+Date.now();
          fallback.onload=()=>resolve();
          fallback.onerror=()=>reject(new Error("Não foi possível carregar "+file));
          document.body.appendChild(fallback);
        };
        document.body.appendChild(primary);
      });
    }

    try{
      await loadScript("nucleo/supabase-config.js?v=20260819-v81-4-8");
      await loadScript("nucleo/supabase-client.js?v=20260819-v81-4-8");
      await loadScript("nucleo/auth.js?v=20260819-v81-4-8");
      await loadScript("nucleo/dados-app.js?v=20260819-v81-4-8");
      await loadScript("nucleo/theme-system-v80.js?v=20260819-v81-4-8");
      await loadScript("nucleo/shell-v81.js?v=20260819-v81-4-8");
      await window.MMCDShell(window.MMCD_TREINO_PAGE_MODE==="configuracoes"?"treinos-config":"treinos");
      await loadScript("nucleo/social-card-v81-4-7.js?v=20260818-v81-4-7");
      await loadScript("modulos/treinos/treinos-data-v62.js?v=20260819-v81-4-8");
      await loadScript("modulos/treinos/treinos-visuais-v81-11-1.js?v=20260822-v81-11-1");
      await loadScript("modulos/treinos/treinos-catalogo-v81-11-1.js?v=20260822-v81-11-1");
      await loadScript("modulos/treinos/treinos-v81-11-2.js?v=20260822-v81-11-2");
      await loadScript("modulos/treinos/treinos-guiado-v79.js?v=20260819-v81-4-8");
    }catch(error){
      console.error("Falha ao iniciar Treinos:",error);
      const status=document.querySelector("#treino-save-status");
      if(status) status.textContent="Falha ao carregar — atualize a página";
      const root=document.querySelector("#treino-today-root") || document.querySelector("#treino-settings-root");
      if(root && !root.innerHTML.trim()){
        root.innerHTML='<article style="padding:20px;border:1px solid #ddd;border-radius:12px"><strong>Não foi possível carregar os arquivos do módulo Treinos.</strong><p>Atualize a página. Se persistir, feche e abra novamente o Memory.</p></article>';
      }
    }
  })();
  </script>
